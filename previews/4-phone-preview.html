<style>:root{--bg:#eef1f8;--fg:#172A43;--navy:#26336F;--red:#E6382E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1424;--fg:#e8ecf4}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;justify-items:center;gap:12px;padding:16px}
.tabs{display:flex;gap:8px}.tabs button{padding:8px 18px;border:2px solid var(--navy);background:transparent;color:var(--fg);border-radius:99px;font:inherit;font-weight:600;cursor:pointer}.tabs .on{background:var(--navy);color:#fff}

&lt;title&gt;YAKU Uganda – Homepage preview&lt;/title&gt;&lt;meta name=&quot;color-scheme&quot; content=&quot;light dark&quot;&gt;
&lt;style&gt;
:root{--navy:#26336F;--red:#E6382E;--ink:#172A43;--bg:#fff;--fg:#172A43;--h:#26336F;--soft:#f4f6fb;--line:#e3e6ee;--flash:#fff3f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1b2d;--fg:#e8ecf4;--h:#aab6ee;--soft:#1a2a42;--line:#2a3b57;--flash:#2a1f27}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif}
a{color:inherit;text-decoration:none}h1,h2,h3{color:var(--h);line-height:1.2}
.hdr{position:sticky;top:0;background:#fff;color:var(--ink);z-index:10;border-bottom:1px solid var(--line)}
.top{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;padding:8px 14px}
.top img{display:block;max-width:100%;height:auto}.ico{background:none;border:0;font-size:26px;color:var(--navy);cursor:pointer}
.search{grid-column:1/-1;order:5;display:flex}.search input{flex:1;min-width:0;padding:10px;border:1.5px solid var(--red);border-right:0;border-radius:8px 0 0 8px;font:inherit}
.search button{background:var(--ink);color:#fff;border:0;padding:0 18px;border-radius:0 8px 8px 0;font:inherit}
.acts{display:flex;gap:12px;align-items:center;font-size:14px}.acts .i{font-size:20px}
.depts{display:flex;overflow-x:auto;background:var(--navy);scrollbar-width:none}.depts a{color:#fff;padding:10px 14px;white-space:nowrap;font-size:14px}.depts a:hover{background:var(--red)}
.drawer{position:fixed;inset:0;background:#0008;z-index:20;display:none}.drawer.on{display:block}.drawer aside{background:#fff;color:var(--ink);width:min(320px,85vw);height:100%;padding:12px 20px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.hero{background:linear-gradient(120deg,var(--navy) 55%,var(--ink));color:#fff;padding:48px 20px}.hero div{max-width:1100px;margin:auto}.hero h1{color:#fff;font-size:clamp(1.7rem,5vw,3rem);max-width:18ch;margin:0 0 12px}.hero p{max-width:46ch;margin:0 0 20px}
.btn{display:inline-block;background:var(--red);color:#fff;border:2px solid var(--red);padding:10px 20px;border-radius:8px;font-weight:600}.btn.g{background:transparent}
.sec{max-width:1200px;margin:auto;padding:28px 16px}.sh{display:flex;justify-content:space-between;align-items:baseline}.sh h2{margin:0}.sh a{color:var(--red);font-weight:600}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:12px}.cats a{border:1.5px solid var(--line);border-left:5px solid var(--red);padding:16px;border-radius:8px;font-weight:600;color:var(--h)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:14px}.card{border:1px solid var(--line);border-radius:8px;padding:10px}.ph{aspect-ratio:4/3;background:var(--soft);border-radius:4px}.card h3{font-size:15px;margin:8px 0 4px}
.price{font-weight:700;color:var(--red);margin:0}.price s{color:#889;font-weight:400;margin-left:8px}.empty{background:var(--soft);padding:14px;border-radius:8px;margin-top:12px}
.flash{background:var(--flash)}.pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.pills span{border:1px solid var(--line);border-radius:99px;padding:8px 16px}
.promos{display:grid;gap:12px}.promos a{background:var(--navy);color:#fff;padding:28px;border-radius:10px;font-weight:700}.promos a:last-child{background:var(--red)}
.ftr{background:var(--ink);color:#fff;padding:32px 16px 12px;margin-top:32px}.cols{max-width:1200px;margin:auto;display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.ftr h4{margin:0 0 8px}.ftr a{display:block;padding:2px 0;opacity:.9}.ftr .lg{background:#fff;border-radius:10px;padding:6px;display:inline-block}.copy{text-align:center;opacity:.7;font-size:14px}
.bar{background:#ffe9a8;color:#3a2f00;padding:8px 14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between}.bar button{font:inherit;border:1px solid #3a2f00;background:transparent;border-radius:6px;padding:4px 10px;cursor:pointer}
@media(min-width:900px){.top{grid-template-columns:auto auto 1fr auto}.search{grid-column:auto;order:0}.promos{grid-template-columns:1fr 1fr}}

.bar button+button{margin-left:6px}.splash{position:fixed;inset:0;z-index:100;background:#fff;display:grid;place-items:center;overflow:hidden;animation:sfade .5s ease 2.4s forwards}
.sl{--d:min(520px,96vw);position:relative;width:min(380px,80vw);aspect-ratio:720/337}
.sl img{position:absolute;inset:0;width:100%;height:100%;animation:sspin 1.8s cubic-bezier(.22,.8,.25,1) both}
.sl .ring{position:absolute;left:50%;top:50%;width:var(--d);height:var(--d);margin:calc(var(--d)/-2) 0 0 calc(var(--d)/-2);border-radius:50%;border:5px solid transparent;border-top-color:#E6382E;border-right-color:#26336F;animation:sring 1.4s linear infinite,sgrow 1.8s ease-out both}
@keyframes sspin{from{transform:rotate(-540deg) scale(.1);opacity:0}50%{opacity:1}to{transform:none}}
@keyframes sring{to{transform:rotate(360deg)}}
@keyframes sgrow{from{opacity:0;width:calc(var(--d)*.3);height:calc(var(--d)*.3);margin:calc(var(--d)*-.15) 0 0 calc(var(--d)*-.15)}}
@keyframes sfade{to{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){.splash{display:none}}
.info{max-width:760px;margin:auto;padding:28px 16px}.crumbs{font-size:14px;margin-bottom:8px}.crumbs a{color:var(--red)}.upd{color:#889;font-size:14px}
.prose h2{font-size:1.25rem;margin:1.6em 0 .4em}.prose p,.prose li{max-width:70ch}.prose a{color:var(--red);text-decoration:underline}
.sform{display:grid;gap:12px;margin:16px 0}.sform label{display:grid;gap:4px;font-weight:600}.sform input,.sform select,.sform textarea{padding:10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;width:100%;background:var(--bg);color:var(--fg)}
.cookie{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#172A43;color:#fff;padding:14px 16px;box-shadow:0 -4px 16px #0004}.cookie p{margin:0 0 8px}.cookie .btn{padding:8px 14px;cursor:pointer;font:inherit;font-weight:600}.cookie .g{color:#fff}.cbtn{display:flex;flex-wrap:wrap;gap:8px}.ctog{display:grid;gap:6px;margin:8px 0}
.lk{background:none;border:0;color:#fff;font:inherit;cursor:pointer;padding:2px 0;opacity:.9;text-decoration:underline}.msgp{background:var(--soft);padding:10px;border-radius:8px}

#studio .snav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--ink)}#studio .snav a{color:#fff;padding:8px 14px;border-radius:8px;white-space:nowrap;font-size:14px;text-decoration:none}#studio .snav a.on{background:var(--red)}
#studio .sbody{max-width:900px;margin:auto;padding:16px}#studio h1,#studio h2,#studio h3{color:var(--h)}#studio .shero h1{color:#fff;margin:0 0 6px}
#studio .shero{background:linear-gradient(120deg,var(--ink),var(--navy));color:#fff;border-left:8px solid var(--red);border-radius:12px;padding:26px 18px}
#studio .scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:16px 0}#studio .scard{display:block;border:1.5px solid var(--line);border-top:5px solid var(--red);border-radius:10px;padding:12px;color:var(--fg);text-decoration:none}#studio .scard b{display:block;color:var(--h);margin:4px 0}
#studio input,#studio select,#studio textarea{padding:10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--fg);width:100%}#studio input[type=checkbox],#studio input[type=radio]{width:auto}
#studio .row{display:flex;gap:10px;flex-wrap:wrap}#studio .row&gt;label{flex:1;min-width:140px}#studio .msg{background:var(--soft);padding:12px;border-radius:8px}#studio .card{margin:12px 0;padding:12px;border-radius:10px}
#studio .chat{border:1px solid var(--line);border-radius:14px;max-width:420px;overflow:hidden;box-shadow:0 8px 30px #0003}#studio .ch{display:flex;justify-content:space-between;background:var(--navy);color:#fff;padding:10px 14px}#studio .cm{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:260px;max-height:360px;overflow-y:auto}
#studio .ab,#studio .ub{margin:0;padding:8px 12px;border-radius:12px;max-width:88%}#studio .ab{background:#eef1f8;color:#172A43;align-self:flex-start}#studio .ub{background:var(--navy);color:#fff;align-self:flex-end}
.chip{border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;margin:2px}#studio .cin{display:flex;gap:6px;padding:8px}
#studio .attach{display:grid;place-items:center;padding:0 10px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer;font-size:18px}#studio .chips{display:flex;flex-wrap:wrap;gap:4px}
#studio .iss{border-left:5px solid var(--navy);padding:6px 12px;margin:10px 0;background:var(--soft)}#studio .iss.e{border-color:var(--red)}#studio .iss.w{border-color:#e0a100}#studio .iss p{margin:4px 0}
#studio .cmp{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}#studio .ph{aspect-ratio:3/2;background:var(--soft);border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;font-size:14px;opacity:.8}
#studio table{border-collapse:collapse;width:100%}#studio th,#studio td{border-bottom:1px solid var(--line);padding:8px;text-align:left}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:60;background:#172A43;color:#fff;padding:10px 16px;border-radius:10px;max-width:90vw;box-shadow:0 6px 20px #0006}.fabx{position:fixed;right:14px;bottom:90px;z-index:45;background:var(--red);color:#fff;border-radius:99px;padding:12px 18px;font-weight:700;text-decoration:none;box-shadow:0 4px 14px #0005}

var PG={&quot;about&quot;:{&quot;t&quot;:&quot;About YAKU Uganda&quot;,&quot;k&quot;:null,&quot;f&quot;:null,&quot;b&quot;:&quot;## Who we are\nYAKU Uganda is a modern online marketplace that brings stationery, office equipment, printing, branding and graphic design services together on one convenient platform.\nOur goal is to make it easier for individuals, businesses, schools, organizations and entrepreneurs to access quality products and professional creative services.\nYAKU operates a hybrid marketplace. You can buy products and services directly from YAKU, and you can discover products and services from approved independent vendors and professional designers.\n## What we offer\n- Stationery and office supplies\n- Printers and photocopiers\n- Printing materials, inks and toners\n- Professional printing services\n- Branding and promotional materials\n- Graphic design services\n- Business cards, banners, flyers and stickers\n- Customized T-shirts, mugs and promotional products\n- Office equipment and accessories\n## Our mission\nTo simplify access to quality stationery, printing, branding and creative services through a convenient, reliable and accessible digital marketplace.\n## Our vision\nTo become a trusted destination in Uganda for stationery, printing, branding and creative business solutions.\n## Why choose YAKU?\n- Convenient online shopping\n- Wide product selection\n- Access to independent vendors and designers\n- Easy ordering and quotation requests\n- Convenient payment options\n- Customer support and order assistance\n## Our commitment\nWe are committed to a convenient shopping experience, to supporting local businesses, to creating opportunities for independent vendors and designers, and to helping customers bring their ideas to life.\n**YAKU Uganda \u2013 Your Complete Creative and Office Marketplace.**&quot;},&quot;careers&quot;:{&quot;t&quot;:&quot;Careers at YAKU&quot;,&quot;k&quot;:&quot;form&quot;,&quot;f&quot;:&quot;career&quot;,&quot;b&quot;: rk for printing, you confirm that you own it or have permission to use it. YAKU may refuse or stop a job if there is a reasonable concern about infringement.\n## Vendor and designer responsibilities\nVendors and designers must make sure their products, images and creative materials do not unlawfully infringe anyone else&#x27;s intellectual property rights. Listings that do may be removed and accounts suspended.\n## Report a copyright violation\nIf you believe material on YAKU infringes your copyright, send the details below. Administrators review each complaint and take appropriate action, which may include removing the material and contacting the vendor or designer.&quot;},&quot;terms&quot;:{&quot;t&quot;:&quot;Terms and Conditions&quot;,&quot;k&quot;:null,&quot;f&quot;:null,&quot;b&quot;:&quot;These terms govern your use of YAKU. Please read them with our [Privacy Policy](/info/privacy) and [Return &amp; Refund Policy](/info/refunds).\n## 1. Introduction and acceptance of terms\nBy accessing or using YAKU you agree to these terms. If you do not agree, please do not use the platform.\n## 2. About YAKU Uganda\nYAKU operates both as a direct seller of its own products and services and as a marketplace that connects customers with independent vendors and designers. The seller of each item is shown on its listing.\n## 3. User registration and accounts\nGive accurate information and keep your password secure. You are responsible for activity on your account. Vendor and designer accounts require approval by YAKU.\n## 4. Customer responsibilities\nUse YAKU lawfully, provide correct contact and delivery details, and check your order before confirming it.\n## 5. Product listings and descriptions\nWe and our vendors aim to describe products accurately. Colours and finishes may vary slightly. Please report errors you notice.\n## 6. Independent vendor responsibilities\nVendors are responsible for their listings, stock, pricing, quality, the lawfulness of their goods and fulfilment. YAKU may remove listings or suspend vendors who breach these terms.\n## 7. Designer marketplace responsibilities\nDesigners must deliver services as described, hold the rights to the work they provide, and follow agreed timelines and revisions.\n## 8. Orders and order confirmation\nAn order is confirmed only when YAKU confirms it in your account or by message. We may decline or cancel an order, for example for unavailable stock, a pricing error or suspected fraud.\n## 9. Payments and payment verification\nAn order is treated as paid only after YAKU or its payment provider has verified the payment.\n## 10. Pricing and additional charges\nPrices are in Uganda shillings (UGX) unless stated. Delivery, printing, design or other charges are shown before you confirm an order.\n## 11. Printing and customized orders\nCustomized items are made to your specification. Production starts after approval and payment. See the [Return &amp; Refund Policy](/info/refunds) for how problems are handled.\n## 12. Artwork uploads and customer approvals\nYou confirm you have the right to use the artwork you upload. Please check proofs carefully. Once you approve a proof, errors in the approved content, such as spelling, are your responsibility. Production faults remain ours.\n## 13. Delivery and shipping\nDelivery options, charges and estimated times are confirmed when you place an order. Please provide an accurate address.\n## 14. Cancellations and refunds\nThese are governed by the [Return &amp; Refund Policy](/info/refunds).\n## 15. Prohibited activities\nYou must not sell or order unlawful or counterfeit goods, commit fraud, upload harmful or infringing content, misuse or scrape the platform, or harass others.\n## 16. Account suspension and termination\nWe may suspend or end accounts for breaches of these terms, fraud or legal reasons. You may ask us to close your account at any time.\n## 17. Intellectual property rights\nSee our [IPR Protection Policy](/info/ipr).\n## 18. Privacy and personal data\nSee our [Privacy Policy](/info/privacy).\n## 19. Limitation of liability\nTo the extent permitted by Ugandan law, YAKU is not liable for indirect or consequential loss. Nothing in these terms excludes liability that cannot be excluded by law or limits your statutory consumer rights.\n## 20. Changes to these terms\nWe may update these terms. The date at the top of this page shows the latest update. Continued use after a change means you accept it.\n## 21. Contact information\n{{business_name}}, {{address}}. Phone: {{phone}}. Email: {{email}}.\n## 22. Governing law\nThese terms are governed by the laws of the Republic of Uganda. You keep the right to use external dispute resolution and the courts.&quot;},&quot;credit-terms&quot;:{&quot;t&quot;:&quot;Store &amp; Credit Terms&quot;,&quot;k&quot;:null,&quot;f&quot;:null,&quot;b&quot;:&quot;## How purchases work\nYou can buy products and services from YAKU and from approved vendors and designers. Orders are confirmed and paid as described in our [Terms and Conditions](/info/terms).\n## Payment requirements\nPayment must be verified before an order is treated as paid. Payment options are shown at checkout.\n## Store credit, vouchers and promotional credit\nYAKU may add store credit, discount vouchers or promotional credit to your account. Each one is subject to the conditions shown with it, including any expiry date, eligible items and minimum spend. Promotional credit cannot be exchanged for cash unless the conditions say so.\n## Balance adjustments and refunds\nIf an order paid with credit is refunded, the credit is returned to your account where possible, unless it has expired. We may correct balances that were applied in error and will tell you when we do.\n## Not a loan or lending service\nYAKU does not offer loans, lending or financial credit facilities. Store credit is a balance you can spend on YAKU only.\n## Incorrect balances or payment records\nIf a balance or payment record looks wrong, [contact support](/info/contact) with your order number.&quot;},&quot;disputes&quot;:{&quot;t&quot;:&quot;Dispute Resolution Policy&quot;,&quot;k&quot;:&quot;form&quot;,&quot;f&quot;:&quot;dispute&quot;,&quot;b&quot;:&quot;We want to fix problems quickly and fairly.\n## What you can report\n- Incorrect or damaged products\n- Missing orders and delayed deliveries\n- Payment problems\n- Printing quality and branding disagreements\n- Vendor misconduct and designer service complaints\n- Refund requests\n## How it works\nSubmit the form below. An administrator reviews your case, may contact you and the vendor or designer, and records the outcome. Possible resolutions include replacement, reprinting, a refund where applicable, a delivery correction or another appropriate remedy.\n## Your legal rights\nThis process does not limit your legal rights. You may use external dispute resolution or the courts at any time.\n## Submit a dispute&quot;},&quot;privacy&quot;:{&quot;t&quot;:&quot;Privacy Policy Notice&quot;,&quot;k&quot;:null,&quot;f&quot;:null,&quot;b&quot;:&quot;This notice explains how YAKU collects, uses, stores and protects personal information. We handle personal data in line with Uganda&#x27;s Data Protection and Privacy Act, 2019.\n## Information we collect\n- Full name, email address and phone number\n- Account information and delivery address\n- Order history and transaction records\n- Uploaded artwork\n- Vendor business information\n- Customer support communications\n## How we use it\n- Creating and managing your account\n- Processing orders and verifying payments\n- Arranging delivery\n- Communicating with vendors and designers about your orders\n- Customer support\n- Preventing fraud\n- Improving the platform\n- Meeting legal obligations\n## Who we share it with\nWe share only what is needed with payment providers, delivery providers, the vendors and designers fulfilling your order, hosting providers and other service providers that help us run YAKU. We do not sell your personal information.\n## Security and retention\nWe use access controls and secure hosting to protect your data. We keep it only as long as needed for the purposes above or as the law requires.\n## Your rights\nYou may ask to access, correct or delete your personal information, subject to applicable law. [Contact us](/info/contact) to make a request.\n## Cookies\nSee our [Cookie Notice](/info/cookies).\n## Changes\nWe will update this notice when our practices change. The date at the top shows the latest update.\n## Contact\n{{business_name}}, {{address}}. Email: {{email}}.&quot;},&quot;cookies&quot;:{&quot;t&quot;:&quot;Cookie Notice&quot;,&quot;k&quot;:null,&quot;f&quot;:null,&quot;b&quot;:&quot;Cookies are small files stored on your device. We use them as follows.\n## Essential cookies\nNeeded for sign-in, shopping carts and basic site functions. They are always on.\n## Preference cookies\nRemember your settings.\n## Analytics cookies\nHelp us understand site performance and visitor activity.\n## Marketing cookies\nSupport relevant promotions where enabled and where consent is required.\n## Your choices\nPreference, analytics and marketing cookies stay off until you agree. Your choice is saved in your browser, and you can change it at any time.&quot;},&quot;refunds&quot;:{&quot;t&quot;:&quot;Return &amp; Refund Policy&quot;,&quot;k&quot;:null,&quot;f&quot;:null,&quot;b&quot;:&quot;## When you can return an item or ask for a refund\n- Damaged products\n- Incorrect products\n- Missing items or incomplete orders\n- Products that differ significantly from their description\n- Defective equipment\n- Printing errors and poor-quality customized products\n- Cancelled orders, where the order has not gone into production\n## Customized products\nBanners, business cards, stickers, branded clothing and other personalized items may not be returned for change of mind once production has begun. Defective, incorrect or non-conforming items and services are always handle
