<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>YAKU Business Console – layout preview</title><meta name="color-scheme" content="light dark">
<style>:root{--navy:#26336F;--red:#E6382E;--ink:#172A43;--bg:#fff;--fg:#172A43;--h:#26336F;--soft:#f4f6fb;--line:#e3e6ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1b2d;--fg:#e8ecf4;--h:#aab6ee;--soft:#1a2a42;--line:#2a3b57}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}h1,h2,h3{color:var(--h);line-height:1.2}
.bar{background:#ffe9a8;color:#3a2f00;padding:8px 14px;font-size:14px}.hd{background:#fff;padding:8px 14px;border-bottom:1px solid var(--line)}.hd img{display:block;max-width:100%;height:auto}
.form{max-width:420px;margin:auto;padding:32px 16px}.form form{display:grid;gap:14px}.form label{display:grid;gap:4px;font-weight:600}.form input,select{padding:10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--fg)}
.btn{display:inline-block;background:var(--red);color:#fff;border:2px solid var(--red);padding:10px 20px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}.btn.g{background:transparent;color:var(--h);border-color:var(--navy)}.msg{background:var(--soft);padding:10px;border-radius:8px}
.cons{display:grid;max-width:1300px;margin:auto}.nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--ink)}.nav button{white-space:nowrap;padding:8px 14px;border:0;border-radius:8px;background:transparent;color:#fff;font:inherit;cursor:pointer}.nav .on{background:var(--red)}.main{padding:16px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:12px 0}.stat{border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:8px;padding:12px;display:grid;gap:4px}.stat span{font-size:13px;opacity:.75}.stat strong{font-size:1.15rem;color:var(--h)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;white-space:nowrap}.empty{background:var(--soft);padding:14px;border-radius:8px}.note{font-size:14px;opacity:.8}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:4px 12px;margin:3px}
@media(min-width:900px){.cons{grid-template-columns:200px 1fr}.nav{flex-direction:column;overflow:visible;min-height:70vh}}</style></head><body>
